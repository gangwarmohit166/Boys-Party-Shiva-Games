<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boys Party – Shiva Games</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    header {
      background: #2563eb;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      padding: 30px 15px;
    }

    h2 {
      color: #60a5fa;
    }

    .game-btn {
      display: block;
      width: 90%;
      max-width: 300px;
      margin: 15px auto;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .game-btn:hover {
      background: #16a34a;
    }

    #game {
      margin-top: 25px;
      padding: 20px;
      background: #1f2937;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <header>Boys Party – Shiva Games</header>

  <div class="container">
    <h2>Welcome to Boys Party Games 🎮</h2>
    <p>Select a game and start playing!</p>

    <button class="game-btn" onclick="startGame('Guess the Number')">
      🎯 Guess the Number
    </button>

    <button class="game-btn" onclick="startGame('Coming Soon')">
      🏆 More Games Coming Soon
    </button>

    <div id="game">
      Click a game to start!
    </div>
  </div>

  <script>
    function startGame(game) {
      if (game === 'Guess the Number') {
        let number = Math.floor(Math.random() * 10) + 1;
        let guess = prompt("Guess a number between 1 and 10:");

        if (Number(guess) === number) {
          document.getElementById("game").innerHTML =
            "🎉 Congratulations! You guessed correctly!";
        } else {
          document.getElementById("game").innerHTML =
            "❌ Wrong! The correct number was " + number + ". Try again!";
        }
      } else {
        document.getElementById("game").innerHTML =
          "🚀 More exciting games are coming soon!";
      }
    }
  </script>
</body>
</html>
